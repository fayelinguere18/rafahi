<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rafahi Boutique - Commandes</title>
<style>
:root{
  --bg:#f6f1e7;
  --card:#fffdf8;
  --line:#e7dfcf;
  --ink:#2b2a26;
  --muted:#8b8577;
  --sage:#7f9a82;
  --sage-dark:#3f5c47;
  --sage-soft:#e1ebe1;
  --ok-bg:#d6ead6;--ok-tx:#2f6b3a;
  --no-bg:#f4d9d2;--no-tx:#8a3a2c;
  --wa-bg:#f7e4b8;--wa-tx:#7a5a12;
  --ne-bg:#ebe7dd;--ne-tx:#6b665b;
  --bl-bg:#dde6f3;--bl-tx:#2f4f7f;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:20px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px;text-transform:capitalize}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mc .l{font-size:12px;color:var(--muted)}
.mc .v{font-size:22px;font-weight:600;margin-top:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:9px 8px;font-size:12px;font-weight:500;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
tr:last-child td{border-bottom:none}
.n{text-align:right}
.ed{min-width:46px;outline:none;white-space:pre-wrap;border-radius:5px;padding:2px 5px;margin:-2px -5px;line-height:1.45}
.ed:focus{background:#f3ede0;box-shadow:0 0 0 1px var(--line)}
.ed:empty:before{content:attr(data-ph);color:#c0b9a8}
input[type=date]{border:1px solid transparent;background:transparent;font:inherit;color:inherit;padding:1px 3px;border-radius:5px;width:128px}
input[type=date]:focus{outline:none;background:#f3ede0;border-color:var(--line)}
.pill{border:none;border-radius:999px;padding:3px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.xb{border:none;background:transparent;color:#b3ab98;cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.xb:hover{color:var(--no-tx)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button.b{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font:inherit;color:var(--ink);cursor:pointer}
button.b:hover{background:#f3ede0}
button.go{background:var(--sage-dark);border-color:var(--sage-dark);color:#fff}
button.go:hover{background:#34503c}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:transparent;padding:7px 14px;font:inherit;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--sage-soft);color:var(--sage-dark);font-weight:600}
.st{font-size:12px;color:var(--muted);margin-left:auto}
.st.err{color:var(--no-tx)}
.cap .xcol,.cap .tools{display:none}
.empty{padding:26px;text-align:center;color:var(--muted)}
#login{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px}
#login h1{margin-bottom:4px}
#login p{color:var(--muted);margin:0 0 16px}
#login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin-bottom:10px}
#login .e{color:var(--no-tx);min-height:20px;font-size:13px;margin-bottom:6px}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr 1fr}.mc .v{font-size:18px}}
</style>
</head>
<body>

<div id="login">
  <h1>Rafahi Boutique</h1>
  <p>Entre le code d'accès pour voir les commandes.</p>
  <input id="code" type="password" placeholder="Code d'accès" autocomplete="current-password">
  <div class="e" id="loginErr"></div>
  <button class="b go" id="loginBtn" style="width:100%">Ouvrir</button>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <div>
      <h1>Commandes Rafahi Boutique</h1>
      <div class="sub" id="today"></div>
    </div>
    <div class="tools">
      <button class="b" id="refresh">Actualiser</button>
      <button class="b" id="logout">Se déconnecter</button>
    </div>
  </div>

  <div class="cards">
    <div class="mc"><div class="l">Clientes à livrer</div><div class="v" id="mA">0</div></div>
    <div class="mc"><div class="l">Articles à livrer</div><div class="v" id="mB">0</div></div>
    <div class="mc"><div class="l">À encaisser</div><div class="v" id="mC">0</div></div>
  </div>

  <div class="bar tools">
    <div class="seg" id="seg">
      <button data-f="tout" class="on">Tout</button>
      <button data-f="jour">Aujourd'hui</button>
      <button data-f="impayees">Non payées</button>
    </div>
    <span class="st" id="st"></span>
  </div>

  <div class="box" id="box">
    <table>
      <thead>
        <tr>
          <th>Cliente</th><th>Tailles (prix)</th><th>Couleurs</th><th class="n">Qté</th><th class="n">Total</th>
          <th>Paiement</th><th>Livraison</th><th>Adresse</th><th>Date</th><th>Téléphone</th><th class="xcol"></th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Aucune commande à afficher.</div>
  </div>

  <div class="bar tools">
    <button class="b go" id="add">+ Ajouter une cliente</button>
    <button class="b" id="cap">Mode capture</button>
  </div>
  <div class="bar" id="capBack" hidden>
    <button class="b" id="capOff">Revenir à la modification</button>
  </div>
</div>

<script>
var API="https://rafahi-relais.fayelinguere18.workers.dev";
var PAY=["Payé","Non payé"];
var LIV=["À livrer","Livrée","Reportée"];
var COL={
  "Payé":["var(--ok-bg)","var(--ok-tx)"],
  "Non payé":["var(--no-bg)","var(--no-tx)"],
  "À livrer":["var(--wa-bg)","var(--wa-tx)"],
  "Livrée":["var(--ne-bg)","var(--ne-tx)"],
  "Reportée":["var(--bl-bg)","var(--bl-tx)"]
};
var code=store("get","rafahi_code")||"";
var orders=[];
var filter="tout";

function store(op,k,v){
  try{
    if(op==="get")return localStorage.getItem(k);
    if(op==="set")localStorage.setItem(k,v);
    if(op==="del")localStorage.removeItem(k);
  }catch(e){}
  return null;
}
function $(id){return document.getElementById(id);}
function parseNum(v){
  if(v===""||v==null)return null;
  var n=Number(String(v).replace(/[\s\u00a0\u202f]/g,"").replace(",","."));
  return isFinite(n)?n:null;
}
function fmt(v){
  var n=parseNum(v);
  return n==null?"":n.toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ");
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function setStatus(t,err){
  var s=$("st");
  s.textContent=t;
  s.className="st"+(err?" err":"");
}

function api(method,path,body){
  return fetch(API+path,{
    method:method,
    headers:{"x-access-code":code,"Content-Type":"application/json"},
    body:body?JSON.stringify(body):undefined
  }).then(function(res){
    return res.json().then(function(data){
      if(res.status===401){logout("Code d'accès incorrect");throw new Error("Code d'accès incorrect");}
      if(!res.ok)throw new Error(data.error||"Erreur");
      return data;
    });
  });
}

function showApp(on){
  $("login").hidden=on;
  $("app").hidden=!on;
}
function logout(msg){
  store("del","rafahi_code");
  code="";
  orders=[];
  showApp(false);
  $("loginErr").textContent=msg||"";
}

function load(silent){
  if(!silent)setStatus("Chargement...");
  return api("GET","/orders").then(function(d){
    orders=d.orders;
    showApp(true);
    render();
    setStatus("À jour");
  }).catch(function(e){
    if(e.message!=="Code d'accès incorrect")setStatus("Erreur : "+e.message,true);
  });
}

function save(o,patch){
  setStatus("Enregistrement...");
  Object.keys(patch).forEach(function(k){o[k]=patch[k];});
  api("PATCH","/orders/"+o.id,patch).then(function(){
    setStatus("Enregistré");
    summary();
  }).catch(function(e){
    setStatus("Erreur : "+e.message,true);
  });
}

function visible(o){
  if(filter==="jour")return o.date===todayStr()&&o.livraison!=="Livrée";
  if(filter==="impayees")return o.paiement==="Non payé";
  return true;
}

function summary(){
  var cl={},art=0,enc=0,nb=0;
  orders.forEach(function(o){
    if(o.livraison==="À livrer"){
      nb++;
      art+=parseNum(o.qte)||0;
    }
    if(o.paiement==="Non payé"&&o.livraison!=="Livrée")enc+=parseNum(o.total)||0;
  });
  $("mA").textContent=nb;
  $("mB").textContent=art;
  $("mC").textContent=fmt(enc)||"0";
}

function ed(o,key,ph,opts){
  var d=document.createElement("div");
  d.className="ed";
  d.contentEditable="plaintext-only";
  if(d.contentEditable!=="plaintext-only")d.contentEditable="true";
  d.setAttribute("data-ph",ph);
  var num=opts&&opts.num;
  var multi=opts&&opts.multi;
  d.textContent=num?fmt(o[key]):(o[key]||"");
  if(opts&&opts.bold)d.style.fontWeight="600";
  var before=d.textContent;
  d.addEventListener("focus",function(){before=d.innerText.trim();});
  d.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!multi){e.preventDefault();d.blur();}
  });
  d.addEventListener("blur",function(){
    var v=d.innerText.trim();
    if(v===before)return;
    if(num){
      var n=parseNum(v);
      d.textContent=n==null?"":fmt(n);
      save(o,(function(){var p={};p[key]=v;return p;})());
    }else{
      save(o,(function(){var p={};p[key]=v;return p;})());
    }
  });
  return d;
}

function pill(o,key,list){
  var b=document.createElement("button");
  b.type="button";
  b.className="pill";
  function paint(){
    var v=o[key]||"";
    b.textContent=v||"À choisir";
    var c=COL[v]||COL["Livrée"];
    b.style.background=c[0];
    b.style.color=c[1];
  }
  b.addEventListener("click",function(){
    var i=list.indexOf(o[key]);
    var next=list[(i+1)%list.length];
    paint();
    var p={};p[key]=next;
    save(o,p);
    paint();
    if(filter!=="tout")setTimeout(render,250);
  });
  paint();
  return b;
}

function cell(tr,child,cls){
  var td=document.createElement("td");
  if(cls)td.className=cls;
  td.appendChild(child);
  tr.appendChild(td);
  return td;
}

function row(o){
  var tr=document.createElement("tr");
  cell(tr,ed(o,"cliente","Nom",{bold:true}));
  cell(tr,ed(o,"tailles","M (5 000)",{multi:true}));
  cell(tr,ed(o,"couleurs","M : noir",{multi:true}));
  cell(tr,ed(o,"qte","0",{num:true}),"n");
  cell(tr,ed(o,"total","0",{num:true,bold:true}),"n");
  cell(tr,pill(o,"paiement",PAY));
  cell(tr,pill(o,"livraison",LIV));
  cell(tr,ed(o,"adresse","Adresse"));
  var di=document.createElement("input");
  di.type="date";
  di.value=o.date||"";
  di.addEventListener("change",function(){
    save(o,{date:di.value});
    if(filter==="jour")setTimeout(render,250);
  });
  cell(tr,di);
  cell(tr,ed(o,"telephone","Téléphone"));
  var x=document.createElement("button");
  x.type="button";
  x.className="xb";
  x.setAttribute("aria-label","Supprimer la ligne");
  x.textContent="\u00d7";
  x.addEventListener("click",function(){
    if(!confirm("Supprimer cette ligne ?"))return;
    setStatus("Suppression...");
    api("DELETE","/orders/"+o.id).then(function(){
      orders=orders.filter(function(z){return z.id!==o.id;});
      render();
      setStatus("Supprimé");
    }).catch(function(e){setStatus("Erreur : "+e.message,true);});
  });
  var td=cell(tr,x);
  td.className="xcol";
  return tr;
}

function render(){
  var body=$("body");
  body.innerHTML="";
  var list=orders.filter(visible);
  list.forEach(function(o){body.appendChild(row(o));});
  $("empty").hidden=list.length>0;
  summary();
}

$("loginBtn").addEventListener("click",function(){
  var v=$("code").value.trim();
  if(!v){$("loginErr").textContent="Écris le code d'accès";return;}
  code=v;
  $("loginErr").textContent="";
  api("GET","/orders").then(function(d){
    store("set","rafahi_code",code);
    orders=d.orders;
    $("code").value="";
    showApp(true);
    render();
    setStatus("À jour");
  }).catch(function(e){
    if(e.message!=="Code d'accès incorrect")$("loginErr").textContent="Erreur : "+e.message;
  });
});
$("code").addEventListener("keydown",function(e){if(e.key==="Enter")$("loginBtn").click();});
$("logout").addEventListener("click",function(){logout("");});
$("refresh").addEventListener("click",function(){load(false);});

$("seg").addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(!b)return;
  filter=b.getAttribute("data-f");
  Array.prototype.forEach.call($("seg").children,function(x){x.className=x===b?"on":"";});
  render();
});

$("add").addEventListener("click",function(){
  setStatus("Ajout...");
  api("POST","/orders",{cliente:"",paiement:"Non payé",livraison:"À livrer"}).then(function(d){
    orders.push(d.order);
    if(filter!=="tout"){
      filter="tout";
      Array.prototype.forEach.call($("seg").children,function(x){x.className=x.getAttribute("data-f")==="tout"?"on":"";});
    }
    render();
    setStatus("Ligne ajoutée");
    var last=$("body").lastElementChild;
    if(last)last.querySelector(".ed").focus();
  }).catch(function(e){setStatus("Erreur : "+e.message,true);});
});

function setCapture(on){
  $("app").className=on?"wrap cap":"wrap";
  $("capBack").hidden=!on;
}
$("cap").addEventListener("click",function(){setCapture(true);});
$("capOff").addEventListener("click",function(){setCapture(false);});

$("today").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

setInterval(function(){
  if($("app").hidden)return;
  var a=document.activeElement;
  if(a&&(a.isContentEditable||a.tagName==="INPUT"))return;
  load(true);
},60000);

if(code){
  load(false).then(function(){if($("app").hidden)showApp(false);});
}
</script>
</body>
</html>
